<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>
        NETVISION | TV
    </title>

    <meta
        name="description"
        content="NETVISION - Televisión en vivo"
    >

    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- HLS.JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/hls.js@latest">
    </script>


    <!-- =====================================================
         ESTILOS EXCLUSIVOS DE TV
    ====================================================== -->

    <style>

        /* =================================================
           BASE
        ================================================= */

        html,
        body {

            margin: 0;

            padding: 0;

            min-height: 100%;

            background:
                #050b14;

            color:
                #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            overflow-x:
                hidden;

        }


        * {

            box-sizing:
                border-box;

        }


        button {

            font-family:
                inherit;

        }


        /* =================================================
           APP
        ================================================= */

        .tv-page-app {

            min-height:
                100vh;

            background:
                linear-gradient(
                    180deg,
                    #07111f 0%,
                    #081522 45%,
                    #050b14 100%
                );

        }


        /* =================================================
           NAVBAR
        ================================================= */

        .tv-navbar {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            width:
                100%;

            min-height:
                72px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            padding:
                0 28px;

            background:
                rgba(
                    5,
                    13,
                    25,
                    .94
                );

            border-bottom:
                1px solid
                rgba(
                    86,
                    190,
                    255,
                    .12
                );

            backdrop-filter:
                blur(16px);

        }


        .tv-logo {

            text-decoration:
                none;

            color:
                #ffffff;

            font-size:
                23px;

            font-weight:
                800;

            letter-spacing:
                .5px;

            white-space:
                nowrap;

        }


        .tv-logo span {

            color:
                #57c8ff;

        }


        .tv-nav {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            flex:
                1;

        }


        .tv-nav a {

            color:
                #b9c7d8;

            text-decoration:
                none;

            padding:
                10px 16px;

            border-radius:
                10px;

            font-size:
                14px;

            transition:
                .2s ease;

        }


        .tv-nav a:hover {

            color:
                #ffffff;

            background:
                rgba(
                    87,
                    200,
                    255,
                    .10
                );

        }


        .tv-nav a.active {

            color:
                #ffffff;

            background:
                rgba(
                    87,
                    200,
                    255,
                    .14
                );

            box-shadow:
                inset 0 0 0 1px
                rgba(
                    87,
                    200,
                    255,
                    .18
                );

        }


        .tv-profile {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            padding:
                7px 12px 7px 7px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .08
                );

            border-radius:
                30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .04
                );

            color:
                #ffffff;

        }


        .tv-profile-avatar {

            width:
                34px;

            height:
                34px;

            border-radius:
                50%;

            display:
                grid;

            place-items:
                center;

            background:
                linear-gradient(
                    135deg,
                    #5ed1ff,
                    #248fd0
                );

            color:
                #03111d;

            font-weight:
                800;

        }


        .tv-profile-name {

            font-size:
                13px;

            color:
                #d8e5f2;

        }


        /* =================================================
           CONTENEDOR
        ================================================= */

        .tv-main {

            width:
                min(
                    1500px,
                    calc(100% - 40px)
                );

            margin:
                0 auto;

            padding:
                32px 0 60px;

        }


        /* =================================================
           CABECERA
        ================================================= */

        .tv-heading {

            margin-bottom:
                22px;

        }


        .tv-kicker {

            display:
                inline-block;

            margin-bottom:
                7px;

            color:
                #58caff;

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                2px;

        }


        .tv-heading h1 {

            margin:
                0;

            font-size:
                clamp(
                    28px,
                    4vw,
                    46px
                );

            line-height:
                1.05;

        }


        .tv-heading p {

            margin:
                10px 0 0;

            color:
                #8ea4b9;

            font-size:
                15px;

        }


        /* =================================================
           AREA PRINCIPAL
        ================================================= */

        .tv-layout {

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1.75fr
                )
                minmax(
                    300px,
                    .75fr
                );

            gap:
                18px;

            align-items:
                stretch;

        }


        /* =================================================
           PLAYER
        ================================================= */

        .tv-player-card {

            position:
                relative;

            min-width:
                0;

            min-height:
                460px;

            overflow:
                hidden;

            border:
                1px solid
                rgba(
                    88,
                    202,
                    255,
                    .15
                );

            border-radius:
                18px;

            background:
                #000;

            box-shadow:
                0 18px 50px
                rgba(
                    0,
                    0,
                    0,
                    .35
                );

        }


        .tv-player {

            display:
                block;

            width:
                100%;

            height:
                100%;

            min-height:
                460px;

            object-fit:
                contain;

            background:
                #000;

        }


        /* =================================================
           PLACEHOLDER
        ================================================= */

        .tv-placeholder {

            position:
                absolute;

            inset:
                0;

            z-index:
                5;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            padding:
                30px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(
                        33,
                        104,
                        153,
                        .20
                    ),
                    rgba(
                        0,
                        0,
                        0,
                        .94
                    )
                );

        }


        .tv-placeholder.hidden {

            display:
                none;

        }


        .tv-placeholder-icon {

            width:
                82px;

            height:
                82px;

            margin-bottom:
                20px;

            border:
                1px solid
                rgba(
                    88,
                    202,
                    255,
                    .22
                );

            border-radius:
                50%;

            display:
                grid;

            place-items:
                center;

            background:
                rgba(
                    88,
                    202,
                    255,
                    .08
                );

            color:
                #5acaff;

            font-size:
                30px;

        }


        .tv-placeholder h2 {

            margin:
                0;

            font-size:
                23px;

        }


        .tv-placeholder p {

            max-width:
                430px;

            margin:
                10px 0 0;

            color:
                #8399ad;

            font-size:
                14px;

        }


        /* =================================================
           PANEL DERECHO
        ================================================= */

        .tv-side-panel {

            min-width:
                0;

            display:
                flex;

            flex-direction:
                column;

            padding:
                22px;

            border:
                1px solid
                rgba(
                    88,
                    202,
                    255,
                    .14
                );

            border-radius:
                18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(
                        14,
                        31,
                        49,
                        .95
                    ),
                    rgba(
                        7,
                        17,
                        29,
                        .95
                    )
                );

        }


        .tv-live-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            width:
                fit-content;

            padding:
                7px 11px;

            border-radius:
                999px;

            background:
                rgba(
                    72,
                    208,
                    255,
                    .08
                );

            color:
                #59ccff;

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                1px;

        }


        .tv-live-dot {

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            background:
                #58caff;

            box-shadow:
                0 0 10px
                rgba(
                    88,
                    202,
                    255,
                    .8
                );

        }


        /* =================================================
           CANAL ACTUAL
        ================================================= */

        .tv-current {

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

            margin:
                22px 0;

            padding:
                15px;

            border-radius:
                14px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .035
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .05
                );

        }


        .tv-current-logo {

            flex:
                0 0 62px;

            width:
                62px;

            height:
                62px;

            display:
                grid;

            place-items:
                center;

            overflow:
                hidden;

            border-radius:
                13px;

            background:
                #0c1b2b;

            border:
                1px solid
                rgba(
                    88,
                    202,
                    255,
                    .12
                );

            color:
                #58caff;

            font-weight:
                800;

        }


        .tv-current-logo img {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            padding:
                7px;

        }


        .tv-current-text {

            min-width:
                0;

        }


        .tv-current-text h2 {

            margin:
                0;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            font-size:
                16px;

        }


        .tv-current-text p {

            margin:
                5px 0 0;

            color:
                #7f96aa;

            font-size:
                12px;

        }


        /* =================================================
           CATEGORÍAS
        ================================================= */

        .tv-categories-title {

            margin:
                2px 0 10px;

            color:
                #8199ad;

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                1.5px;

        }


        .tv-category-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                7px;

            max-height:
                290px;

            overflow-y:
                auto;

            padding-right:
                4px;

        }


        .tv-category-list::-webkit-scrollbar {

            width:
                4px;

        }


        .tv-category-list::-webkit-scrollbar-thumb {

            background:
                rgba(
                    88,
                    202,
                    255,
                    .25
                );

            border-radius:
                20px;

        }


        .tv-category-button {

            width:
                100%;

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            padding:
                11px 12px;

            border:
                1px solid
                transparent;

            border-radius:
                10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .025
                );

            color:
                #a8b9c9;

            text-align:
                left;

            cursor:
                pointer;

            transition:
                .2s ease;

        }


        .tv-category-button:hover {

            color:
                #ffffff;

            background:
                rgba(
                    88,
                    202,
                    255,
                    .07
                );

        }


        .tv-category-button.active {

            color:
                #ffffff;

            border-color:
                rgba(
                    88,
                    202,
                    255,
                    .20
                );

            background:
                linear-gradient(
                    90deg,
                    rgba(
                        88,
                        202,
                        255,
                        .13
                    ),
                    rgba(
                        88,
                        202,
                        255,
                        .04
                    )
                );

        }


        .category-icon {

            width:
                25px;

            text-align:
                center;

        }


        .category-name {

            flex:
                1;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            font-size:
                13px;

        }


        .category-arrow {

            color:
                #58caff;

            font-size:
                18px;

        }


        /* =================================================
           CANALES
        ================================================= */

        .tv-channel-section {

            margin-top:
                20px;

            padding:
                20px;

            border:
                1px solid
                rgba(
                    88,
                    202,
                    255,
                    .12
                );

            border-radius:
                18px;

            background:
                rgba(
                    9,
                    23,
                    37,
                    .8
                );

        }


        .tv-channel-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                15px;

        }


        .tv-channel-header h2 {

            margin:
                0;

            font-size:
                18px;

        }


        .tv-channel-count {

            color:
                #6f879b;

            font-size:
                12px;

        }


        /* =================================================
           FILA HORIZONTAL
        ================================================= */

        .tv-channel-row {

            display:
                flex;

            flex-wrap:
                nowrap;

            gap:
                12px;

            overflow-x:
                auto;

            overflow-y:
                hidden;

            padding:
                4px 3px 12px;

            scroll-behavior:
                smooth;

            scrollbar-width:
                thin;

            scrollbar-color:
                rgba(
                    88,
                    202,
                    255,
                    .28
                )
                transparent;

        }


        .tv-channel-row::-webkit-scrollbar {

            height:
                6px;

        }


        .tv-channel-row::-webkit-scrollbar-track {

            background:
                transparent;

        }


        .tv-channel-row::-webkit-scrollbar-thumb {

            background:
                rgba(
                    88,
                    202,
                    255,
                    .25
                );

            border-radius:
                20px;

        }


        /* =================================================
           TARJETA CANAL
        ================================================= */

        .tv-channel-card {

            flex:
                0 0 190px;

            min-width:
                190px;

            min-height:
                115px;

            padding:
                14px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

            border-radius:
                14px;

            background:
                linear-gradient(
                    145deg,
                    rgba(
                        19,
                        42,
                        62,
                        .9
                    ),
                    rgba(
                        8,
                        20,
                        32,
                        .95
                    )
                );

            cursor:
                pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .2s ease;

        }


        .tv-channel-card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(
                    88,
                    202,
                    255,
                    .35
                );

            background:
                linear-gradient(
                    145deg,
                    rgba(
                        24,
                        57,
                        82,
                        .95
                    ),
                    rgba(
                        8,
                        22,
                        35,
                        .95
                    )
                );

        }


        .tv-channel-card.selected {

            border-color:
                rgba(
                    88,
                    202,
                    255,
                    .55
                );

            box-shadow:
                0 0 0 1px
                rgba(
                    88,
                    202,
                    255,
                    .08
                );

        }


        .tv-channel-logo {

            width:
                54px;

            height:
                54px;

            margin-bottom:
                10px;

            display:
                grid;

            place-items:
                center;

            overflow:
                hidden;

            border-radius:
                11px;

            background:
                #091725;

            color:
                #58caff;

            font-weight:
                800;

        }


        .tv-channel-logo img {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            padding:
                6px;

        }


        .tv-channel-name {

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;

            color:
                #ffffff;

            font-size:
                13px;

            font-weight:
                700;

        }


        .tv-channel-live {

            margin-top:
                5px;

            color:
                #58caff;

            font-size:
                10px;

            font-weight:
                700;

        }


        /* =================================================
           MENSAJES
        ================================================= */

        .tv-message {

            width:
                100%;

            padding:
                25px;

            text-align:
                center;

            color:
                #91a5b7;

        }


        .tv-error {

            color:
                #ff8e8e;

        }


        /* =================================================
           PANTALLA GRANDE
        ================================================= */

        @media (
            min-width: 1200px
        ) {

            .tv-player-card,
            .tv-player {

                min-height:
                    560px;

            }

            .tv-side-panel {

                min-height:
                    560px;

            }

        }


        /* =================================================
           TABLET
        ================================================= */

        @media (
            max-width: 1000px
        ) {

            .tv-layout {

                grid-template-columns:
                    1fr;

            }


            .tv-player-card,
            .tv-player {

                min-height:
                    430px;

            }


            .tv-side-panel {

                min-height:
                    auto;

            }


            .tv-category-list {

                display:
                    flex;

                flex-direction:
                    row;

                max-height:
                    none;

                overflow-x:
                    auto;

                overflow-y:
                    hidden;

            }


            .tv-category-button {

                flex:
                    0 0 auto;

                width:
                    auto;

                min-width:
                    150px;

            }

        }


        /* =================================================
           MÓVIL
        ================================================= */

        @media (
            max-width: 700px
        ) {

            .tv-navbar {

                min-height:
                    62px;

                padding:
                    0 14px;

            }


            .tv-nav {

                display:
                    none;

            }


            .tv-profile-name {

                display:
                    none;

            }


            .tv-main {

                width:
                    calc(
                        100% - 20px
                    );

                padding:
                    18px 0 35px;

            }


            .tv-heading {

                margin-bottom:
                    14px;

            }


            .tv-heading h1 {

                font-size:
                    29px;

            }


            .tv-heading p {

                font-size:
                    13px;

            }


            .tv-layout {

                gap:
                    10px;

            }


            .tv-player-card {

                min-height:
                    220px;

                border-radius:
                    13px;

            }


            .tv-player {

                min-height:
                    220px;

                height:
                    220px;

            }


            .tv-placeholder {

                padding:
                    18px;

            }


            .tv-placeholder-icon {

                width:
                    58px;

                height:
                    58px;

                margin-bottom:
                    12px;

                font-size:
                    22px;

            }


            .tv-placeholder h2 {

                font-size:
                    18px;

            }


            .tv-placeholder p {

                font-size:
                    12px;

            }


            .tv-side-panel {

                padding:
                    14px;

                border-radius:
                    13px;

            }


            .tv-current {

                margin:
                    12px 0;

                padding:
                    11px;

            }


            .tv-current-logo {

                flex-basis:
                    48px;

                width:
                    48px;

                height:
                    48px;

            }


            .tv-current-text h2 {

                font-size:
                    14px;

            }


            .tv-current-text p {

                font-size:
                    11px;

            }


            .tv-categories-title {

                margin-top:
                    4px;

            }


            .tv-category-list {

                gap:
                    7px;

            }


            .tv-category-button {

                min-width:
                    135px;

                padding:
                    9px;

            }


            .tv-channel-section {

                margin-top:
                    10px;

                padding:
                    13px;

                border-radius:
                    13px;

            }


            .tv-channel-header {

                margin-bottom:
                    9px;

            }


            .tv-channel-header h2 {

                font-size:
                    15px;

            }


            .tv-channel-count {

                font-size:
                    10px;

            }


            .tv-channel-row {

                gap:
                    9px;

            }


            .tv-channel-card {

                flex-basis:
                    155px;

                min-width:
                    155px;

                min-height:
                    105px;

                padding:
                    11px;

            }


            .tv-channel-logo {

                width:
                    45px;

                height:
                    45px;

                margin-bottom:
                    7px;

            }


            .tv-channel-name {

                font-size:
                    12px;

            }

        }


        /* =================================================
           TELÉFONOS MUY PEQUEÑOS
        ================================================= */

        @media (
            max-width: 390px
        ) {

            .tv-main {

                width:
                    calc(
                        100% - 14px
                    );

            }


            .tv-heading h1 {

                font-size:
                    26px;

            }


            .tv-player,
            .tv-player-card {

                min-height:
                    195px;

                height:
                    195px;

            }


            .tv-channel-card {

                flex-basis:
                    145px;

                min-width:
                    145px;

            }

        }


        /* =================================================
           LANDSCAPE EN MÓVIL
        ================================================= */

        @media (
            max-width: 900px
        )
        and (
            orientation: landscape
        ) {

            .tv-navbar {

                min-height:
                    52px;

            }


            .tv-main {

                padding-top:
                    10px;

            }


            .tv-heading {

                display:
                    none;

            }


            .tv-layout {

                grid-template-columns:
                    minmax(
                        0,
                        1.7fr
                    )
                    minmax(
                        220px,
                        .7fr
                    );

            }


            .tv-player,
            .tv-player-card {

                min-height:
                    calc(
                        100vh - 95px
                    );

                height:
                    calc(
                        100vh - 95px
                    );

            }


            .tv-side-panel {

                max-height:
                    calc(
                        100vh - 95px
                    );

                overflow:
                    hidden;

            }


            .tv-category-list {

                flex-direction:
                    column;

                overflow-y:
                    auto;

                overflow-x:
                    hidden;

            }


            .tv-category-button {

                width:
                    100%;

                min-width:
                    0;

            }


            .tv-channel-section {

                margin-top:
                    10px;

            }

        }


        /* =================================================
           ACCESIBILIDAD
        ================================================= */

        .tv-channel-card:focus,
        .tv-category-button:focus {

            outline:
                2px solid
                #58caff;

            outline-offset:
                2px;

        }

    </style>

</head>


<body>


<div class="tv-page-app">


    <!-- =================================================

    <header class="tv-navbar">


        <a
            href="index.html"
            class="tv-logo"

            <a

            <a

    <main class="tv-main">

        <section class="tv-layout">

                    </div>

                    <h2>

                    </h2>

                    <p>
                        Elige un canal para comenzar
                        a reproducir.
                    </p>

                </div>


            </div>


            <!-- =================================================
                 PANEL DERECHO
            ================================================= -->

            <aside class="tv-side-panel">


                <div class="tv-live-badge">

                    <span class="tv-live-dot"></span>

                    EN VIVO

                </div>


                <!-- CANAL ACTUAL -->

                <div class="tv-current">


                    <div
                        id="currentChannelLogo"
                        class="tv-current-logo"
                    >
                        TV
                    </div>


                    <div class="tv-current-text">

                        <h2
                            id="selectedChannelName"
                        >
                            Ningún canal seleccionado
                        </h2>


                        <p
                            id="selectedChannelCategory"
                        >
                            Selecciona un canal para comenzar
                        </p>

                    </div>


                </div>


                <!-- CATEGORÍAS -->

                    id="selectedCategoryTitle"
                >
                    📺 CANALES
                </h2>


                <span
                    id="selectedCategoryCount"
                    class="tv-channel-count"
                >
                    0 canales
                </span>

                id="selectedCategoryChannels"

<!-- =====================================================
     JAVASCRIPT TV
====================================================== -->

<script>

"use strict";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const M3U_FILE =
    "canales.m3u";


let channels = [];

let currentChannel = null;

let currentCategory = null;

let hls = null;


/* =========================================================
   ELEMENTOS
========================================================= */

let videoPlayer;

let playerPlaceholder;

let selectedChannelName;

let selectedChannelCategory;

let currentChannelLogo;

let tvCategories;

let selectedCategoryTitle;

let selectedCategoryCount;

let selectedCategoryChannels;


/* =========================================================
   INICIO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        cacheElements();

        resetTV();

        loadM3U();

    }
);


/* =========================================================
   CACHE ELEMENTOS
========================================================= */

function cacheElements() {

    videoPlayer =
        document.getElementById(
            "videoPlayer"
        );


    playerPlaceholder =
        document.getElementById(
            "playerPlaceholder"
        );


    selectedChannelName =
        document.getElementById(
            "selectedChannelName"
        );


    selectedChannelCategory =
        document.getElementById(
            "selectedChannelCategory"
        );


    currentChannelLogo =
        document.getElementById(
            "currentChannelLogo"
        );


    tvCategories =
        document.getElementById(
            "tvCategories"
        );


    selectedCategoryTitle =
        document.getElementById(
            "selectedCategoryTitle"
        );


    selectedCategoryCount =
        document.getElementById(
            "selectedCategoryCount"
        );


    selectedCategoryChannels =
        document.getElementById(
            "selectedCategoryChannels"
        );

}


/* =========================================================
   RESET TV
   NO SELECCIONA NINGÚN CANAL
========================================================= */

function resetTV() {

    currentChannel =
        null;


    currentCategory =
        null;


    if (hls) {

        try {

            hls.destroy();

        } catch (error) {}

        hls =
            null;

    }


    if (videoPlayer) {

        try {

            videoPlayer.pause();

        } catch (error) {}


        videoPlayer.removeAttribute(
            "src"
        );


        videoPlayer.load();

    }


    if (playerPlaceholder) {

        playerPlaceholder.classList.remove(
            "hidden"
        );

        playerPlaceholder.style.display =
            "flex";

    }


    if (selectedChannelName) {

        selectedChannelName.textContent =
            "Ningún canal seleccionado";

    }


    if (selectedChannelCategory) {

        selectedChannelCategory.textContent =
            "Selecciona un canal para comenzar";

    }


    if (currentChannelLogo) {

        currentChannelLogo.innerHTML =
            "TV";

    }

}


/* =========================================================
   CARGAR M3U
========================================================= */

async function loadM3U() {

    try {

        console.log(
            "NETVISION TV: cargando",
            M3U_FILE
        );


        const response =
            await fetch(
                M3U_FILE,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const text =
            await response.text();


        channels =
            parseM3U(
                text
            );


        console.log(
            "NETVISION TV:",
            channels.length,
            "canales cargados"
        );


        if (!channels.length) {

            showTVMessage(
                "La lista de canales está vacía."
            );

            return;

        }


        renderCategories();


    } catch (error) {

        console.error(
            "NETVISION TV - Error M3U:",
            error
        );


        showTVMessage(
            "No se pudo cargar canales.m3u. Verifica que el archivo esté junto a tv.html."
        );

    }

}


/* =========================================================
   PARSEAR M3U
========================================================= */

function parseM3U(
    text
) {

    const lines =
        String(
            text || ""
        )
            .split(
                /\r?\n/
            )
            .map(
                line =>
                    line.trim()
            )
            .filter(
                Boolean
            );


    const result = [];


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i];


        if (
            !line.startsWith(
                "#EXTINF:"
            )
        ) {

            continue;

        }


        const info =
            line.substring(
                8
            );


        const comma =
            info.indexOf(
                ","
            );


        const attributes =
            comma >= 0
                ? info.substring(
                    0,
                    comma
                )
                : info;


        const name =
            comma >= 0
                ? info.substring(
                    comma + 1
                ).trim()
                : "Canal sin nombre";


        let url =
            "";


        for (
            let j = i + 1;
            j < lines.length;
            j++
        ) {

            if (
                !lines[j].startsWith(
                    "#"
                )
            ) {

                url =
                    lines[j];

                break;

            }

        }


        if (!url) {

            continue;

        }


        result.push({

            id:
                getAttr(
                    attributes,
                    "tvg-id"
                ) ||
                slug(
                    name
                ),

            name:
                name,

            url:
                url,

            logo:
                getAttr(
                    attributes,
                    "tvg-logo"
                ),

            category:
                getAttr(
                    attributes,
                    "group-title"
                ) ||
                "Otros"

        });

    }


    return result;

}


/* =========================================================
   ATRIBUTOS M3U
========================================================= */

function getAttr(
    text,
    attr
) {

    const regex =
        new RegExp(
            `${attr}="([^"]*)"`,
            "i"
        );


    const match =
        text.match(
            regex
        );


    return match
        ? match[1]
        : "";

}


/* =========================================================
   CATEGORÍAS
========================================================= */

function renderCategories() {

    if (!tvCategories) {

        return;

    }


    const categories =
        [
            ...new Set(
                channels.map(
                    channel =>
                        channel.category ||
                        "Otros"
                )
            )
        ];


    tvCategories.innerHTML =
        "";


    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "tv-category-button";


            button.dataset.category =
                category;


            button.innerHTML = `

                <span class="category-icon">
                    ${categoryIcon(
                        category
                    )}
                </span>

                <span class="category-name">
                    ${escapeHTML(
                        category
                    )}
                </span>

                <span class="category-arrow">
                    ›
                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    selectCategory(
                        category
                    );

                }
            );


            tvCategories.appendChild(
                button
            );

        }
    );


    /*
       Importante:
       mostramos la primera categoría
       para que aparezcan los canales,
       PERO NO seleccionamos ningún
       canal automáticamente.
    */

    if (
        categories.length
    ) {

        selectCategory(
            categories[0]
        );

    }

}


/* =========================================================
   SELECCIONAR CATEGORÍA
========================================================= */

function selectCategory(
    category
) {

    currentCategory =
        category;


    document
        .querySelectorAll(
            ".tv-category-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.category ===
                    category
                );

            }
        );


    const categoryChannels =
        channels.filter(
            channel =>
                channel.category ===
                category
        );


    renderSelectedChannels(
        category,
        categoryChannels
    );

}


/* =========================================================
   RENDER CANALES
========================================================= */

function renderSelectedChannels(
    category,
    list
) {

    if (
        !selectedCategoryChannels
    ) {

        return;

    }


    if (
        selectedCategoryTitle
    ) {

        selectedCategoryTitle.innerHTML = `

            ${categoryIcon(
                category
            )}

            CANALES DE:

            <span>
                ${escapeHTML(
                    category
                )}
            </span>

        `;

    }


    if (
        selectedCategoryCount
    ) {

        selectedCategoryCount.textContent =
            `${list.length} ${
                list.length === 1
                    ? "canal"
                    : "canales"
            }`;

    }


    selectedCategoryChannels.innerHTML =
        "";


    list.forEach(
        channel => {

            selectedCategoryChannels.appendChild(
                createChannelCard(
                    channel
                )
            );

        }
    );

}


/* =========================================================
   TARJETA CANAL
========================================================= */

function createChannelCard(
    channel
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "tv-channel-card";


    card.tabIndex =
        0;


    const logo =
        channel.logo
            ? `

                <img
                    src="${escapeAttribute(
                        channel.logo
                    )}"
                    alt="${escapeAttribute(
                        channel.name
                    )}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                    "
                >

            `
            : `

                <span>
                    TV
                </span>

            `;


    card.innerHTML = `

        <div class="tv-channel-logo">

            ${logo}

        </div>


        <div class="tv-channel-name">

            ${escapeHTML(
                cleanChannelName(
                    channel.name
                )
            )}

        </div>


        <div class="tv-channel-live">

            ● EN VIVO

        </div>

    `;


    card.addEventListener(
        "click",
        event => {

            event.preventDefault();

            selectChannel(
                channel
            );

        }
    );


    card.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                    "Enter" ||
                event.key ===
                    " "
            ) {

                event.preventDefault();

                selectChannel(
                    channel
                );

            }

        }
    );


    return card;

}


/* =========================================================
   SELECCIONAR CANAL
========================================================= */

function selectChannel(
    channel
) {

    if (
        !channel ||
        !channel.url
    ) {

        return;

    }


    currentChannel =
        channel;


    console.log(
        "NETVISION TV: seleccionando",
        channel.name
    );


    if (
        selectedChannelName
    ) {

        selectedChannelName.textContent =
            cleanChannelName(
                channel.name
            );

    }


    if (
        selectedChannelCategory
    ) {

        selectedChannelCategory.textContent =
            `${channel.category} · EN VIVO`;

    }


    if (
        currentChannelLogo
    ) {

        if (
            channel.logo
        ) {

            currentChannelLogo.innerHTML = `

                <img
                    src="${escapeAttribute(
                        channel.logo
                    )}"
                    alt="${escapeAttribute(
                        channel.name
                    )}"
                >

            `;

        } else {

            currentChannelLogo.innerHTML =
                "<span>TV</span>";

        }

    }


    /*
       Marcar tarjeta seleccionada.
    */

    document
        .querySelectorAll(
            ".tv-channel-card"
        )
        .forEach(
            card => {

                card.classList.remove(
                    "selected"
                );

            }
        );


    /*
       Buscar tarjeta por texto.
    */

    document
        .querySelectorAll(
            ".tv-channel-card"
        )
        .forEach(
            card => {

                const name =
                    card.querySelector(
                        ".tv-channel-name"
                    );


                if (
                    name &&
                    name.textContent.trim() ===
                    cleanChannelName(
                        channel.name
                    )
                ) {

                    card.classList.add(
                        "selected"
                    );

                }

            }
        );


    if (
        playerPlaceholder
    ) {

        playerPlaceholder.classList.add(
            "hidden"
        );

        playerPlaceholder.style.display =
            "none";

    }


    playStream(
        channel.url
    );

}


/* =========================================================
   REPRODUCIR STREAM
========================================================= */

function playStream(
    url
) {

    if (
        !videoPlayer
    ) {

        console.error(
            "NETVISION TV: no existe #videoPlayer"
        );

        return;

    }


    console.log(
        "NETVISION TV: reproduciendo",
        url
    );


    /*
       Destruir HLS anterior.
    */

    if (
        hls
    ) {

        try {

            hls.destroy();

        } catch (error) {}

        hls =
            null;

    }


    videoPlayer.pause();

    videoPlayer.removeAttribute(
        "src"
    );

    videoPlayer.load();


    /*
       HLS.JS
    */

    if (
        window.Hls &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker:
                    true,

                lowLatencyMode:
                    true,

                backBufferLength:
                    90

            });


        hls.attachMedia(
            videoPlayer
        );


        hls.loadSource(
            url
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                videoPlayer
                    .play()
                    .catch(
                        error => {

                            console.log(
                                "NETVISION TV: reproducción automática bloqueada.",
                                error
                            );

                        }
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.error(
                    "NETVISION TV HLS:",
                    data
                );


                if (
                    !data.fatal
                ) {

                    return;

                }


                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    console.log(
                        "NETVISION TV: intentando recuperar red..."
                    );


                    hls.startLoad();

                }

                else if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    console.log(
                        "NETVISION TV: recuperando error multimedia..."
                    );


                    hls.recoverMediaError();

                }

                else {

                    showPlayerError();

                }

            }
        );


        return;

    }


    /*
       HLS NATIVO
       Safari / algunos navegadores.
    */

    if (
        videoPlayer.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        videoPlayer.src =
            url;


        videoPlayer
            .play()
            .catch(
                error => {

                    console.log(
                        "NETVISION TV: autoplay bloqueado.",
                        error
                    );

                }
            );


        return;

    }


    showPlayerError();

}


/* =========================================================
   ERROR DEL PLAYER
========================================================= */

function showPlayerError() {

    if (
        playerPlaceholder
    ) {

        playerPlaceholder.style.display =
            "flex";


        playerPlaceholder.classList.remove(
            "hidden"
        );


        playerPlaceholder.innerHTML = `

            <div class="tv-placeholder-icon">
                ⚠️
            </div>

            <h2>
                No se pudo reproducir
            </h2>

            <p>
                El canal no está disponible
                en este momento.
            </p>

        `;

    }

}


/* =========================================================
   MENSAJE TV
========================================================= */

function showTVMessage(
    message
) {

    if (
        selectedCategoryChannels
    ) {

        selectedCategoryChannels.innerHTML = `

            <div class="tv-message">

                ${escapeHTML(
                    message
                )}

            </div>

        `;

    }

}


/* =========================================================
   ICONOS CATEGORÍA
========================================================= */

function categoryIcon(
    category
) {

    const value =
        String(
            category ||
            ""
        ).toLowerCase();


    if (
        value.includes(
            "anime"
        )
    ) {

        return "🎌";

    }


    if (
        value.includes(
            "infantil"
        ) ||
        value.includes(
            "niño"
        ) ||
        value.includes(
            "kids"
        )
    ) {

        return "🧸";

    }


    if (
        value.includes(
            "deporte"
        ) ||
        value.includes(
            "sport"
        )
    ) {

        return "⚽";

    }


    if (
        value.includes(
            "noticia"
        ) ||
        value.includes(
            "news"
        )
    ) {

        return "📰";

    }


    if (
        value.includes(
            "película"
        ) ||
        value.includes(
            "cine"
        ) ||
        value.includes(
            "movie"
        )
    ) {

        return "🎬";

    }


    if (
        value.includes(
            "música"
        ) ||
        value.includes(
            "music"
        )
    ) {

        return "🎵";

    }


    if (
        value.includes(
            "relig"
        )
    ) {

        return "⛪";

    }


    return "📺";

}


/* =========================================================
   LIMPIAR NOMBRE
========================================================= */

function cleanChannelName(
    name
) {

    return String(
        name ||
        "Canal"
    )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   SLUG
========================================================= */

function slug(
    value
) {

    return String(
        value ||
        ""
    )
        .toLowerCase()
        .normalize(
            "NFD"
        )
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ??
        ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


/* =========================================================
   DETENER TV AL CERRAR
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            hls
        ) {

            try {

                hls.destroy();

            } catch (error) {}

            hls =
                null;

        }


        if (
            videoPlayer
        ) {

            try {

                videoPlayer.pause();

            } catch (error) {}

        }

    }
);

</script>
