<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NETVISION · Catalog Test V2</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<header>
  <div><small>NETVISION · PRUEBA V2</small><h1 id="pageTitle">Películas</h1></div>
  <nav>
    <button data-view="movies">🎬 Películas</button>
    <button data-view="series">📺 Series</button>
  </nav>
</header>

<main>
<section id="catalogView">
  <div id="status" class="status">Cargando…</div>
  <div id="grid" class="grid"></div>
  <div class="pagination">
    <button id="prev">← Anterior</button>
    <span id="pageLabel">Página 1</span>
    <button id="next">Siguiente →</button>
  </div>
</section>

<section id="detailView" hidden>
  <button id="back" class="back">← Volver al catálogo</button>
  <div id="detail"></div>
</section>

<section id="playerView" hidden>
  <button id="backFromPlayer" class="back">← Volver</button>
  <div class="playerBox">
    <div id="playerStatus">Preparando reproducción…</div>
    <video id="video" controls playsinline webkit-playsinline preload="metadata"></video>
    <button id="playButton" class="playButton" hidden>▶ Reproducir</button>
    <iframe id="frame" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen hidden></iframe>
  </div>
  <details><summary>Respuesta de reproducción</summary><pre id="debug"></pre></details>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
